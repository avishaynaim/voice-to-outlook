<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Text</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: #faf9f8; padding: 10px; font-size: 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  h1 { font-size: 16px; color: #0f6cbd; }
  .top div button { background: none; border: none; font-size: 18px; cursor: pointer; }
  #settings { background: #fff; border: 1px solid #e1dfdd; border-radius: 6px; padding: 10px; margin-bottom: 10px; display: none; }
  #settings label { display: block; font-size: 12px; color: #555; margin: 6px 0 2px; }
  #settings input { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
  .btn { padding: 7px 12px; border: none; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-blue { background: #0f6cbd; color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  #settings .btn { margin-top: 8px; width: 100%; }
  #msg { font-size: 12px; min-height: 16px; margin-bottom: 6px; }
  .ok { color: #107c10; } .err { color: #d13438; }
  .item { background: #fff; border: 1px solid #e1dfdd; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .item .txt { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .item .meta { font-size: 11px; color: #999; margin: 6px 0; }
  .item .row { display: flex; gap: 6px; }
  .del { background: #fff; border: 1px solid #d13438; color: #d13438; }
  #empty { color: #999; font-size: 13px; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div class="top">
  <h1>🎙️ Voice Text</h1>
  <div>
    <button onclick="loadList()" title="Refresh">🔄</button>
    <button onclick="toggleSettings()" title="Settings">⚙️</button>
  </div>
</div>

<div id="settings">
  <label>GitHub Token (classic, gist scope only)</label>
  <input type="password" id="token" placeholder="ghp_...">
  <label>Gist ID</label>
  <input type="text" id="gistId">
  <button class="btn btn-blue" onclick="saveSettings()">Save</button>
</div>

<div id="msg"></div>
<div id="list"><div id="empty">Loading...</div></div>

<script>
const $ = id => document.getElementById(id);
let cfg = JSON.parse(localStorage.getItem('v2o-cfg') || '{}');
let items = [];

Office.onReady(() => { init(); });

function init() {
  if (!cfg.token || !cfg.gistId) {
    $('settings').style.display = 'block';
    $('list').innerHTML = '<div id="empty">Enter your GitHub token and Gist ID above, then Save.</div>';
  } else {
    loadList();
  }
}
function toggleSettings() {
  const s = $('settings');
  s.style.display = s.style.display === 'block' ? 'none' : 'block';
  $('token').value = cfg.token || '';
  $('gistId').value = cfg.gistId || '';
}
function saveSettings() {
  cfg = { token: $('token').value.trim(), gistId: $('gistId').value.trim() };
  localStorage.setItem('v2o-cfg', JSON.stringify(cfg));
  $('settings').style.display = 'none';
  loadList();
}
function showMsg(t, ok) { $('msg').textContent = t; $('msg').className = ok ? 'ok' : 'err'; setTimeout(() => $('msg').textContent = '', 4000); }

async function gistGet() {
  const r = await fetch('https://api.github.com/gists/' + cfg.gistId, {
    headers: { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json' },
    cache: 'no-store'
  });
  if (!r.ok) throw new Error('Read failed (' + r.status + ') — check token/gist ID in ⚙️');
  const g = await r.json();
  const f = g.files && g.files['transcripts.json'];
  if (!f) return { items: [] };
  if (f.truncated) throw new Error('Read failed (transcripts truncated)');
  try { return JSON.parse(f.content); } catch (_) { throw new Error('Read failed (stored transcripts unreadable; not overwriting)'); }
}
async function gistSave(data) {
  const r = await fetch('https://api.github.com/gists/' + cfg.gistId, {
    method: 'PATCH',
    headers: { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ files: { 'transcripts.json': { content: JSON.stringify(data, null, 1) } } })
  });
  if (!r.ok) throw new Error('Save failed (' + r.status + ')');
}

async function loadList() {
  if (!cfg.token || !cfg.gistId) { toggleSettings(); return; }
  $('list').innerHTML = '<div id="empty">Loading...</div>';
  try {
    items = (await gistGet()).items || [];
    render();
  } catch (e) {
    $('list').innerHTML = '';
    showMsg(e.message, false);
  }
}

function render() {
  $('list').innerHTML = items.map((i, idx) =>
    '<div class="item"><div class="txt" dir="auto">' + esc(i.text) + '</div>' +
    '<div class="meta">' + new Date(i.ts).toLocaleString() + '</div>' +
    '<div class="row">' +
    '<button class="btn btn-blue btn-sm" onclick="insert(' + idx + ')">Insert</button>' +
    '<button class="btn btn-sm del" onclick="delItem(' + idx + ')">Delete</button>' +
    '</div></div>'
  ).join('') || '<div id="empty">No transcripts yet.<br>Record on your phone, then hit 🔄</div>';
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function insert(idx) {
  Office.context.mailbox.item.body.setSelectedDataAsync(
    items[idx].text,
    { coercionType: Office.CoercionType.Text },
    res => {
      if (res.status === Office.AsyncResultStatus.Succeeded) showMsg('✓ Inserted', true);
      else showMsg('Insert failed: ' + (res.error && res.error.message), false);
    }
  );
}

async function delItem(idx) {
  try {
    const data = await gistGet();
    data.items = (data.items || []).filter(i => i.id !== items[idx].id);
    await gistSave(data);
    items = data.items;
    render();
  } catch (e) { showMsg(e.message, false); }
}
</script>
</body>
</html>
