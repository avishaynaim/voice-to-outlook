<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<title>Voice to Outlook</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { background: #f0f2f5; min-height: 100vh; padding: 12px; max-width: 520px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 20px; color: #1a73e8; }
  .gear { background: none; border: none; font-size: 24px; cursor: pointer; }
  #settings { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; display: none; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  #settings label { display: block; font-size: 13px; color: #555; margin: 8px 0 3px; }
  #settings input { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
  #settings button { margin-top: 12px; width: 100%; }
  .btn { padding: 12px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn-blue { background: #1a73e8; color: #fff; }
  .btn-grey { background: #e4e6eb; color: #333; }
  .lang-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .lang-row button { flex: 1; padding: 10px; border: 2px solid #1a73e8; border-radius: 10px; background: #fff; color: #1a73e8; font-size: 15px; font-weight: 600; }
  .lang-row button.active { background: #1a73e8; color: #fff; }
  #recBtn { width: 110px; height: 110px; border-radius: 50%; border: none; background: #1a73e8; color: #fff; font-size: 44px; display: block; margin: 10px auto; box-shadow: 0 3px 10px rgba(26,115,232,.4); transition: all .2s; }
  #recBtn.recording { background: #d93025; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(217,48,37,.5)} 70%{box-shadow:0 0 0 22px rgba(217,48,37,0)} 100%{box-shadow:0 0 0 0 rgba(217,48,37,0)} }
  #status { text-align: center; color: #666; font-size: 14px; min-height: 20px; margin-bottom: 8px; }
  #transcript { width: 100%; min-height: 130px; padding: 12px; border: 1px solid #ccc; border-radius: 12px; font-size: 16px; resize: vertical; background: #fff; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button { flex: 1; }
  #msg { text-align: center; font-size: 14px; margin-top: 8px; min-height: 18px; }
  .ok { color: #188038; } .err { color: #d93025; }
  h2 { font-size: 15px; color: #555; margin: 18px 0 8px; }
  .item { background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .item .txt { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .item .meta { font-size: 12px; color: #999; margin-top: 4px; display: flex; justify-content: space-between; }
  .item .del { color: #d93025; background: none; border: none; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🎙️ Voice to Outlook</h1>
  <button class="gear" onclick="toggleSettings()">⚙️</button>
</header>

<div id="settings">
  <label>GitHub Token (classic, gist scope only)</label>
  <input type="password" id="token" placeholder="ghp_...">
  <label>Gist ID</label>
  <input type="text" id="gistId" placeholder="e.g. a1b2c3d4...">
  <button class="btn btn-blue" onclick="saveSettings()">Save settings</button>
</div>

<div class="lang-row">
  <button id="langHe" onclick="setLang('he-IL')">עברית</button>
  <button id="langEn" onclick="setLang('en-US')">English</button>
</div>

<button id="recBtn" onclick="toggleRec()">🎙️</button>
<div id="status">Tap to record</div>

<textarea id="transcript" dir="auto" placeholder="Your speech appears here... you can edit it before sending."></textarea>
<div class="actions">
  <button class="btn btn-grey" onclick="clearText()">Clear</button>
  <button class="btn btn-blue" onclick="send()">📤 Send to Outlook</button>
</div>
<div id="msg"></div>

<h2>Recent transcripts</h2>
<div id="list"></div>

<script>
const $ = id => document.getElementById(id);
let cfg = JSON.parse(localStorage.getItem('v2o-cfg') || '{}');
let lang = localStorage.getItem('v2o-lang') || 'he-IL';
let recording = false, rec = null, finalText = '', restartFails = 0;

function toggleSettings() {
  const s = $('settings');
  s.style.display = s.style.display === 'block' ? 'none' : 'block';
  $('token').value = cfg.token || '';
  $('gistId').value = cfg.gistId || '';
}
function saveSettings() {
  cfg = { token: $('token').value.trim(), gistId: $('gistId').value.trim() };
  localStorage.setItem('v2o-cfg', JSON.stringify(cfg));
  $('settings').style.display = 'none';
  showMsg('Settings saved', true);
  loadList();
}
function setLang(l) {
  lang = l; localStorage.setItem('v2o-lang', l);
  $('langHe').classList.toggle('active', l === 'he-IL');
  $('langEn').classList.toggle('active', l === 'en-US');
  if (recording) { stopRec(); startRec(); }  // restart so the session isn't silently dropped
}
function showMsg(t, ok) { $('msg').textContent = t; $('msg').className = ok ? 'ok' : 'err'; setTimeout(() => $('msg').textContent = '', 4000); }

function toggleRec() { recording ? stopRec() : startRec(); }

function startRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showMsg('Speech recognition not supported — use Chrome', false); return; }
  finalText = $('transcript').value ? $('transcript').value + ' ' : '';
  rec = new SR();
  rec.lang = lang;
  rec.continuous = true;
  rec.interimResults = true;
  restartFails = 0;
  rec.onresult = e => {
    restartFails = 0;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    $('transcript').value = finalText + interim;
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed') { showMsg('Microphone permission denied', false); stopRec(); }
    else if (e.error === 'service-not-allowed' || e.error === 'network' || e.error === 'language-not-supported' || e.error === 'audio-capture') { showMsg('Recording stopped: ' + e.error, false); stopRec(); }
    else if (e.error !== 'no-speech' && e.error !== 'aborted') showMsg('Error: ' + e.error, false);
  };
  // auto-restart (Android stops often), with backoff and a cap on consecutive failed restarts
  rec.onend = () => {
    if (!recording) return;
    if (++restartFails > 5) { showMsg('Recording stopped: speech recognition keeps ending', false); stopRec(); return; }
    const r = rec;
    setTimeout(() => {
      if (!recording || rec !== r) return;
      try { r.start(); } catch (_) { showMsg('Recording stopped: could not restart', false); stopRec(); }
    }, Math.min(250 * restartFails, 1500));
  };
  try { rec.start(); } catch (_) {}
  recording = true;
  $('recBtn').classList.add('recording');
  $('recBtn').textContent = '⏹️';
  $('status').textContent = 'Listening (' + (lang === 'he-IL' ? 'עברית' : 'English') + ')... tap to stop';
}
function stopRec() {
  recording = false;
  if (rec) { rec.onend = null; try { rec.stop(); } catch (_) {} }
  $('recBtn').classList.remove('recording');
  $('recBtn').textContent = '🎙️';
  $('status').textContent = 'Tap to record';
}
function clearText() { $('transcript').value = ''; finalText = ''; }

async function gistGet() {
  const r = await fetch('https://api.github.com/gists/' + cfg.gistId, {
    headers: { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json' }
  });
  if (!r.ok) throw new Error('Read failed (' + r.status + ')');
  const g = await r.json();
  const f = g.files && g.files['transcripts.json'];
  if (!f) return { items: [] };
  if (f.truncated) throw new Error('Read failed (transcripts truncated)');
  try { return JSON.parse(f.content); } catch (_) { throw new Error('Read failed (stored transcripts unreadable; not overwriting)'); }
}
async function gistSave(data) {
  const r = await fetch('https://api.github.com/gists/' + cfg.gistId, {
    method: 'PATCH',
    headers: { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ files: { 'transcripts.json': { content: JSON.stringify(data, null, 1) } } })
  });
  if (!r.ok) throw new Error('Save failed (' + r.status + ')');
}

async function send() {
  const text = $('transcript').value.trim();
  if (!text) { showMsg('Nothing to send', false); return; }
  if (!cfg.token || !cfg.gistId) { showMsg('Set token + gist ID in ⚙️ first', false); toggleSettings(); return; }
  stopRec();
  showMsg('Sending...', true);
  try {
    const data = await gistGet();
    data.items = [{ id: Date.now(), text, lang, ts: new Date().toISOString() }, ...(data.items || [])].slice(0, 20);
    await gistSave(data);
    clearText();
    showMsg('✓ Sent! Open the Voice Text panel in Outlook', true);
    renderList(data.items);
  } catch (e) { showMsg(e.message, false); }
}

async function delItem(id) {
  try {
    const data = await gistGet();
    data.items = (data.items || []).filter(i => i.id !== id);
    await gistSave(data);
    renderList(data.items);
  } catch (e) { showMsg(e.message, false); }
}

function renderList(items) {
  $('list').innerHTML = (items || []).map(i =>
    '<div class="item"><div class="txt" dir="auto">' + esc(i.text) + '</div>' +
    '<div class="meta"><span>' + new Date(i.ts).toLocaleString() + '</span>' +
    '<button class="del" onclick="delItem(' + Number(i.id) + ')">Delete</button></div></div>'
  ).join('') || '<div style="color:#999;font-size:13px">No transcripts yet</div>';
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

async function loadList() {
  if (!cfg.token || !cfg.gistId) return;
  try { renderList((await gistGet()).items); } catch (e) { showMsg(e.message, false); }
}

setLang(lang);
loadList();
</script>
</body>
</html>
